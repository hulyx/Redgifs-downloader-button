plugins {
    id 'com.android.application'
}

android {
    namespace 'com.redgifs.downloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.redgifs.downloader"
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "redgifs123"
            keyAlias "redgifs"
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "redgifs123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
