name: Build APK

on:
  push:
    branches: [ master ]
    paths:
      - 'APK/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x APK/gradlew

      - name: Build Debug APK
        working-directory: APK
        run: ./gradlew assembleDebug

      - name: Decode keystore and sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            APK/app/build/outputs/apk/debug/app-debug.apk redgifs
          rm /tmp/release.keystore

      - name: Rename signed APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cp APK/app/build/outputs/apk/debug/app-debug.apk \
            Redgifs-Downloader-v1.1.apk

      - name: Upload signed APK artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RedgifsDownloader-v1.1
          path: Redgifs-Downloader-v1.1.apk
          if-no-files-found: ignore

      - name: Upload debug APK artifact
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RedgifsDownloader-v1.1-debug
          path: APK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x APK/gradlew

      - name: Build Release APK
        working-directory: APK
        run: ./gradlew assembleRelease

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            APK/app/build/outputs/apk/release/app-release-unsigned.apk redgifs
          cp APK/app/build/outputs/apk/release/app-release-unsigned.apk \
            Redgifs-Downloader-${GITHUB_REF_NAME}.apk
          rm /tmp/release.keystore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Redgifs-Downloader-${{ github.ref_name }}.apk
          generate_release_notes: true
